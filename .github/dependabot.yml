# What watches the dependencies, now that they are pinned.
#
# Pinning without watching is how a pipeline ends up running last year's action
# on purpose. The workflow pins every action to a commit SHA, which is what stops
# a moved tag from changing what runs; these rules are what tells you when one of
# those SHAs has a newer release behind it.
#
# Dependabot also needs alerts switched on for this repository, which is a
# setting and not a file: Settings > Advanced Security > Dependabot alerts.
version: 2

updates:
  # The pinned action SHAs. Dependabot understands a SHA pin and updates the
  # comment beside it along with the SHA.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5

  # httpx for the weekly run, plus the two development-only packages.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
